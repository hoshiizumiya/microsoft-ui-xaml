name: One-shot XamlOM generated-file sync

on:
  push:
    branches:
      - automation/xamlom-sync-12272-12282

permissions:
  contents: write

jobs:
  sync:
    name: Sync generated XamlOM outputs for PRs 12272-12282
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout automation branch with all refs
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false

      - name: Initialize once, then regenerate each PR branch sequentially
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targets = @(
              @{ Pr = 12272; Branch = 'patch/column-definition-unsealed' },
              @{ Pr = 12273; Branch = 'patch/picker-flyout-presenter-unsealed' },
              @{ Pr = 12274; Branch = 'patch/date-picker-flyout-item-unsealed' },
              @{ Pr = 12275; Branch = 'patch/control-template-unsealed' },
              @{ Pr = 12276; Branch = 'patch/column-definition-collection-unsealed' },
              @{ Pr = 12277; Branch = 'patch/hub-section-collection-unsealed' },
              @{ Pr = 12278; Branch = 'patch/calendar-panel-unsealed' },
              @{ Pr = 12279; Branch = 'patch/glyphs-unsealed' },
              @{ Pr = 12280; Branch = 'patch/looping-selector-unsealed' },
              @{ Pr = 12281; Branch = 'patch/looping-selector-item-unsealed' },
              @{ Pr = 12282; Branch = 'patch/looping-selector-panel-unsealed' }
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # init.cmd configures a cmd.exe-local environment. Run it exactly once and
          # persist the resulting environment to a runner-local file, then import it
          # into this PowerShell process so every later runcodegen.cmd call inherits it.
          $envFile = Join-Path $env:RUNNER_TEMP 'winui-initialized-env.txt'
          $initScript = Join-Path $env:RUNNER_TEMP 'initialize-winui-once.cmd'
          @"
          @echo off
          call init.cmd x64chk /nopgo
          if errorlevel 1 exit /b 1
          set > "$envFile"
          "@ | Set-Content -Path $initScript -Encoding ascii

          cmd /d /s /c "call `"$initScript`""
          if ($LASTEXITCODE -ne 0) {
              throw "init.cmd failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $envFile)) {
              throw 'init.cmd completed but did not produce the captured environment file.'
          }

          foreach ($line in [IO.File]::ReadLines($envFile)) {
              if ($line.StartsWith('=')) { continue }
              if ($line -match '^([^=]+)=(.*)$') {
                  [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
              }
          }
          Remove-Item $envFile, $initScript -Force

          if (-not $env:RepoRoot -or -not $env:BuildOutputRoot -or -not $env:_BuildArch -or -not $env:_BuildType) {
              throw 'The captured init.cmd environment is missing required WinUI build variables.'
          }
          Write-Host "Initialized WinUI once: arch=$env:_BuildArch flavor=$env:_BuildType"

          foreach ($target in $targets) {
              $pr = $target.Pr
              $branch = $target.Branch

              Write-Host "::group::PR #$pr - $branch"

              # Remove tracked/non-ignored leftovers from the previous branch while
              # preserving ignored restore/build outputs for reuse on this runner.
              git reset --hard HEAD
              if ($LASTEXITCODE -ne 0) { throw "git reset failed before PR #$pr" }
              git clean -fd
              if ($LASTEXITCODE -ne 0) { throw "git clean failed before PR #$pr" }

              git fetch origin "+refs/heads/$branch`:refs/remotes/origin/$branch"
              if ($LASTEXITCODE -ne 0) { throw "Failed to fetch $branch" }

              git switch -C $branch "origin/$branch"
              if ($LASTEXITCODE -ne 0) { throw "Failed to switch to $branch" }

              $dirtyBefore = @(git status --porcelain=v1 -uall)
              if ($dirtyBefore.Count -ne 0) {
                  throw "PR #$pr checkout is not clean before codegen: $($dirtyBefore -join '; ')"
              }

              # A previous attempt may already have completed this branch. Avoid
              # rerunning the generator for an already-created bot output commit.
              $headSubject = (git log -1 --pretty=%s).Trim()
              if ($headSubject -eq 'Regenerate XamlOM outputs') {
                  Write-Host "PR #$pr already ends in the generated-output commit; skipping."
                  ('- PR #{0} (`{1}`): already synchronized; no commit needed.' -f $pr, $branch) | Add-Content $env:GITHUB_STEP_SUMMARY
                  Write-Host "::endgroup::"
                  continue
              }

              # runcodegen.cmd is the repository's canonical checked-in-file generator,
              # but its final ERRORLEVEL is not reliable: successful runs can return 1
              # after updatecheckedinfiles.cmd. Capture its log and trust the explicit
              # success/failure banner emitted by runcodegen.cmd instead.
              $codegenLog = Join-Path $env:RUNNER_TEMP "runcodegen-$pr.log"
              cmd /d /s /c "call dxaml\xcp\runcodegen.cmd > `"$codegenLog`" 2>&1"
              $codegenExitCode = $LASTEXITCODE
              $codegenOutput = @(Get-Content -Path $codegenLog)
              $codegenOutput | Write-Host
              Remove-Item $codegenLog -Force

              $reportedSuccess = [bool]($codegenOutput | Select-String -SimpleMatch 'Code-gen succeeded')
              $reportedFailure = [bool]($codegenOutput | Select-String -SimpleMatch 'Code-gen FAILED')
              $buildFailed = [bool]($codegenOutput | Select-String -SimpleMatch 'Build FAILED.')
              if ($reportedFailure -or $buildFailed -or -not $reportedSuccess) {
                  throw "runcodegen failed for PR #$pr ($branch); exit code $codegenExitCode, success banner=$reportedSuccess, failure banner=$reportedFailure"
              }
              if ($codegenExitCode -ne 0) {
                  Write-Host "runcodegen returned $codegenExitCode after reporting success; continuing with generated-diff validation."
              }

              $tracked = @(git diff --name-only)
              $untracked = @(git ls-files --others --exclude-standard)
              $changed = @($tracked + $untracked | Where-Object { $_ } | Sort-Object -Unique)
              if ($changed.Count -eq 0) {
                  throw "PR #$pr reported successful codegen but produced no checked-in generated diff."
              }

              # XamlGen writes core checked-in outputs under dxaml/xcp and Phone
              # outputs under dxaml/phone. Never let this one-shot bot rewrite source
              # model inputs or unrelated repository files.
              $unexpected = @($changed | Where-Object {
                  ($_ -notmatch '^dxaml/(?:xcp|phone)/') -or
                  ($_ -match '^dxaml/xcp/tools/XCPTypesAutoGen/(?:XamlOM|Modules|OM)/')
              })
              if ($unexpected.Count -ne 0) {
                  throw "PR #$pr codegen changed unexpected files: $($unexpected -join ', ')"
              }

              Write-Host "Generated changes for PR #${pr}:"
              foreach ($file in $changed) { Write-Host "  $file" }

              git add -A -- dxaml/xcp dxaml/phone
              if ($LASTEXITCODE -ne 0) { throw "git add failed for PR #$pr" }

              # Some canonical Phone generated files intentionally contain trailing
              # whitespace. Match the fork's existing validation convention.
              git -c core.whitespace=-blank-at-eol,-blank-at-eof diff --cached --check
              if ($LASTEXITCODE -ne 0) { throw "Generated diff failed git diff --check for PR #$pr" }

              git commit -m 'Regenerate XamlOM outputs'
              if ($LASTEXITCODE -ne 0) { throw "Failed to commit generated outputs for PR #$pr" }

              git push origin "HEAD:$branch"
              if ($LASTEXITCODE -ne 0) { throw "Failed to push generated outputs to $branch" }

              ('- PR #{0} (`{1}`): generated outputs committed and pushed.' -f $pr, $branch) | Add-Content $env:GITHUB_STEP_SUMMARY
              Write-Host "::endgroup::"
          }
