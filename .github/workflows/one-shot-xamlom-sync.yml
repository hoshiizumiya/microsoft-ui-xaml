name: One-shot XamlOM generated-file sync

on:
  push:
    branches:
      - automation/xamlom-sync-12272-12282

permissions:
  contents: write

jobs:
  sync:
    name: Sync generated XamlOM outputs for PRs 12272-12282
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout automation branch with all refs
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false

      - name: Initialize once, then regenerate each PR branch sequentially
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targets = @(
              @{ Pr = 12272; Branch = 'patch/column-definition-unsealed' },
              @{ Pr = 12273; Branch = 'patch/picker-flyout-presenter-unsealed' },
              @{ Pr = 12274; Branch = 'patch/date-picker-flyout-item-unsealed' },
              @{ Pr = 12275; Branch = 'patch/control-template-unsealed' },
              @{ Pr = 12276; Branch = 'patch/column-definition-collection-unsealed' },
              @{ Pr = 12277; Branch = 'patch/hub-section-collection-unsealed' },
              @{ Pr = 12278; Branch = 'patch/calendar-panel-unsealed' },
              @{ Pr = 12279; Branch = 'patch/glyphs-unsealed' },
              @{ Pr = 12280; Branch = 'patch/looping-selector-unsealed' },
              @{ Pr = 12281; Branch = 'patch/looping-selector-item-unsealed' },
              @{ Pr = 12282; Branch = 'patch/looping-selector-panel-unsealed' }
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Initialize the WinUI build environment once. init.cmd modifies only its
          # cmd.exe process, so capture that process environment after initialization
          # and import it into this PowerShell process. All later runcodegen.cmd calls
          # inherit the same initialized environment without repeating repository restore.
          $initOutput = @(cmd /d /s /c 'call init.cmd x64chk /nopgo && echo __WINUI_ENV_BEGIN__ && set' 2>&1)
          $initExitCode = $LASTEXITCODE
          $initOutput | Write-Host
          if ($initExitCode -ne 0) {
              throw "init.cmd failed with exit code $initExitCode"
          }

          $readingEnvironment = $false
          foreach ($lineObject in $initOutput) {
              $line = [string]$lineObject
              if ($line -eq '__WINUI_ENV_BEGIN__') {
                  $readingEnvironment = $true
                  continue
              }
              if (-not $readingEnvironment -or $line.StartsWith('=')) {
                  continue
              }
              if ($line -match '^([^=]+)=(.*)$') {
                  [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
              }
          }
          if (-not $readingEnvironment) {
              throw 'Could not capture the initialized WinUI environment from init.cmd.'
          }
          if (-not $env:RepoRoot -or -not $env:BuildOutputRoot -or -not $env:_BuildArch -or -not $env:_BuildType) {
              throw 'The captured init.cmd environment is missing required WinUI build variables.'
          }

          foreach ($target in $targets) {
              $pr = $target.Pr
              $branch = $target.Branch

              Write-Host "::group::PR #$pr - $branch"

              # Remove tracked/non-ignored leftovers from the previous branch while
              # preserving ignored restore/build outputs for reuse on this runner.
              git reset --hard HEAD
              if ($LASTEXITCODE -ne 0) { throw "git reset failed before PR #$pr" }
              git clean -fd
              if ($LASTEXITCODE -ne 0) { throw "git clean failed before PR #$pr" }

              git fetch origin "+refs/heads/$branch`:refs/remotes/origin/$branch"
              if ($LASTEXITCODE -ne 0) { throw "Failed to fetch $branch" }

              git switch -C $branch "origin/$branch"
              if ($LASTEXITCODE -ne 0) { throw "Failed to switch to $branch" }

              $dirtyBefore = @(git status --porcelain=v1 -uall)
              if ($dirtyBefore.Count -ne 0) {
                  throw "PR #$pr checkout is not clean before codegen: $($dirtyBefore -join '; ')"
              }

              # The build environment was initialized once above. Each branch now only
              # reruns the repository's canonical checked-in-file generator.
              cmd /d /s /c 'call dxaml\xcp\runcodegen.cmd'
              if ($LASTEXITCODE -ne 0) {
                  throw "runcodegen failed for PR #$pr ($branch), exit code $LASTEXITCODE"
              }

              $tracked = @(git diff --name-only)
              $untracked = @(git ls-files --others --exclude-standard)
              $changed = @($tracked + $untracked | Where-Object { $_ } | Sort-Object -Unique)

              # Make the workflow idempotent. A previous attempt may already have
              # synchronized an earlier PR in this batch.
              if ($changed.Count -eq 0) {
                  Write-Host "PR #$pr already has synchronized generated outputs."
                  ('- PR #{0} (`{1}`): already synchronized; no commit needed.' -f $pr, $branch) | Add-Content $env:GITHUB_STEP_SUMMARY
                  Write-Host "::endgroup::"
                  continue
              }

              # XamlGen writes core checked-in outputs under dxaml/xcp and Phone
              # checked-in outputs under dxaml/phone. Never allow the bot to modify
              # the XamlOM source inputs themselves.
              $unexpected = @($changed | Where-Object {
                  ($_ -notmatch '^dxaml/(?:xcp|phone)/') -or
                  ($_ -match '^dxaml/xcp/tools/XCPTypesAutoGen/(?:XamlOM|Modules|OM)/')
              })
              if ($unexpected.Count -ne 0) {
                  throw "PR #$pr codegen changed unexpected files: $($unexpected -join ', ')"
              }

              Write-Host "Generated changes for PR #${pr}:"
              foreach ($file in $changed) { Write-Host "  $file" }

              git add -A -- dxaml/xcp dxaml/phone
              if ($LASTEXITCODE -ne 0) { throw "git add failed for PR #$pr" }

              # XamlGen has checked-in generated files with intentional trailing spaces.
              # Match the repository validation pattern used by the existing fork workflow:
              # still run diff --check, but do not reject blank-at-EOL/EOF generated formatting.
              git -c core.whitespace=-blank-at-eol,-blank-at-eof diff --cached --check
              if ($LASTEXITCODE -ne 0) { throw "Generated diff failed git diff --check for PR #$pr" }

              git commit -m 'Regenerate XamlOM outputs'
              if ($LASTEXITCODE -ne 0) { throw "Failed to commit generated outputs for PR #$pr" }

              git push origin "HEAD:$branch"
              if ($LASTEXITCODE -ne 0) { throw "Failed to push generated outputs to $branch" }

              ('- PR #{0} (`{1}`): generated outputs committed and pushed.' -f $pr, $branch) | Add-Content $env:GITHUB_STEP_SUMMARY
              Write-Host "::endgroup::"
          }
