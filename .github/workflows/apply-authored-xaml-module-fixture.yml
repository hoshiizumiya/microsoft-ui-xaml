''')

          write_preserve('src/XamlCompiler/Tests/RegressionProjects/Basic/CppWinRT/SimpleModules/Views/PanelPage.cpp', r'''#include <unknwn.h>
import Simple.HandwrittenViewsPanelPage;
#include "Views/PanelPage.g.cpp"
