          write_preserve('src/XamlCompiler/Tests/RegressionProjects/Basic/CppWinRT/SimpleModules/EmptyPage.cpp', r'''#include <unknwn.h>
// Copyright (c) Microsoft Corporation.
// Licensed under the MIT License.

import Simple.HandwrittenEmptyPage;
#include "EmptyPage.g.cpp"

namespace winrt::Simple::implementation
{
    EmptyPage::EmptyPage()
