''')

          write_preserve('src/XamlCompiler/Tests/RegressionProjects/Basic/CppWinRT/SimpleModules/Controls/PanelPage.cpp', r'''#include <unknwn.h>
import Simple.HandwrittenControlsPanelPage;
#include "Controls/PanelPage.g.cpp"
namespace winrt::Simple::Controls::implementation
{
    PanelPage::PanelPage() { InitializeComponent(); }
}
''')

          proj = 'src/XamlCompiler/Tests/RegressionProjects/Basic/CppWinRT/SimpleModules/SimpleCppWinRTModules.vcxproj'
          replace(proj,
              '    <CppWinRTBuildModule>true</CppWinRTBuildModule>\n    <CppWinRTUsePrefixes>false</CppWinRTUsePrefixes>',
              '    <CppWinRTBuildModule>true</CppWinRTBuildModule>\n    <CppWinRTXamlCodeBehindModule>Simple.HandwrittenXaml</CppWinRTXamlCodeBehindModule>\n    <CppWinRTUsePrefixes>false</CppWinRTUsePrefixes>')
          replace(proj,
              '''    <ClCompile Include="HandwrittenMainPage.ixx" Condition="'$(CppWinRTBuildModule)' == 'true'" />\n    <ClCompile Include="HandwrittenXaml.ixx" Condition="'$(CppWinRTBuildModule)' == 'true'" />''',
              '''    <ClCompile Include="HandwrittenApp.ixx" Condition="'$(CppWinRTBuildModule)' == 'true'" />\n    <ClCompile Include="HandwrittenMainPage.ixx" Condition="'$(CppWinRTBuildModule)' == 'true'" />\n    <ClCompile Include="HandwrittenEmptyPage.ixx" Condition="'$(CppWinRTBuildModule)' == 'true' and '$(IncludeIncrementalEmptyPage)' != 'false'" />\n    <ClCompile Include="HandwrittenViewsPanelPage.ixx" Condition="'$(CppWinRTBuildModule)' == 'true'" />\n    <ClCompile Include="HandwrittenControlsPanelPage.ixx" Condition="'$(CppWinRTBuildModule)' == 'true'" />\n    <ClCompile Include="HandwrittenXaml.ixx" Condition="'$(CppWinRTBuildModule)' == 'true'">\n      <PreprocessorDefinitions Condition="'$(IncludeIncrementalEmptyPage)' == 'false'">XAML_MODULE_EXCLUDE_EMPTY_PAGE;%(PreprocessorDefinitions)</PreprocessorDefinitions>\n    </ClCompile>''')
          old_target = '''  <Target Name="ConfigureCppWinRTModuleConsumerCompileItems"\n          Condition="'$(CppWinRTBuildModule)' == 'true'"\n          AfterTargets="CppWinRTAddModuleInterfaces;XamlCppWinRTAddModuleInterfaces"\n          BeforeTargets="FixupCLCompileOptions">\n    <ItemGroup>\n      <ClCompile Condition="'%(ClCompile.CompileAs)' != 'CompileAsCppModule'">\n        <PreprocessorDefinitions>WINRT_IMPORT_MODULE;%(ClCompile.PreprocessorDefinitions)</PreprocessorDefinitions>\n      </ClCompile>\n    </ItemGroup>\n  </Target>\n'''
          replace(proj, old_target, '')
          replace(proj,
              '      <ClCompile Remove="CustomEmptyPage.ixx;HandwrittenMainPage.ixx;HandwrittenXaml.ixx" />',
              '      <ClCompile Remove="CustomEmptyPage.ixx;HandwrittenApp.ixx;HandwrittenMainPage.ixx;HandwrittenEmptyPage.ixx;HandwrittenViewsPanelPage.ixx;HandwrittenControlsPanelPage.ixx;HandwrittenXaml.ixx" />')

          print('Converted SimpleModules authored XAML code-behind to named modules.')
          PY

          rm .github/workflows/apply-authored-xaml-module-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Test authored XAML code-behind as named modules"
          git push origin HEAD:feat/xamlccppmodule/product-validation
