name: XamlC early native verification
on:
  push:
    branches: [validation/xamlc-header-ixx-fast-20261004]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  fast-native:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\packages
      CL: '/MP2'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          show-progress: false
      - uses: NuGet/setup-nuget@v2
      - uses: actions/download-artifact@v6
        with:
          name: xaml-module-prereqs-x64chk
          path: BuildOutput
          run-id: 37013844961
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: winui-nuget-x64chk
          path: PackageStore
          run-id: 37013844961
          github-token: ${{ github.token }}
      - name: Restore evaluation prerequisites
        shell: pwsh
        run: |
          [xml]$packagesConfig = Get-Content packages.config
          $cache = $packagesConfig.packages.package | Where-Object { $_.id -eq 'Microsoft.MSBuildCache.Local' }
          nuget install $cache.id -Version $cache.version -OutputDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .github/scripts/materialize-winui-validation-package.ps1
      - name: Build current compiler and exercise its generated native interfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[18.0,19.0)' -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'VS2026 is required.' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $quote = [char]34
          $chain = "call $quote$dev$quote -no_logo -arch=amd64 -host_arch=amd64" +
              " && init.cmd x64chk /nopgo" +
              " && msbuild src\XamlCompiler\Microsoft.UI.Xaml.Markup.Compiler.csproj /t:TransformAll /p:TransformOnBuild=true /p:TransformOutOfDateOnly=false /p:BuildingInsideVisualStudio=true /m:1 /v:minimal" +
              " && msbuild src\XamlCompiler\Microsoft.UI.Xaml.Markup.Compiler.csproj /restore /t:Build /p:Configuration=Debug /p:Platform=x64 /m:2 /ds:false /binaryLogger:BuildOutput\binlogs\Compiler.EarlyNative.binlog" +
              " && powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\validate-xamlc-unit-tests.ps1 -VisualStudioVersion 18.0 -TestCaseFilter FullyQualifiedName~UnitTests.CppWinRTModuleTests -SkipRegressionBuild" +
              " && powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\validate-xamlc-cppwinrt-modules.ps1"
          cmd /d /c $chain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: xamlc-early-native
          path: |
            BuildOutput/binlogs/**
            BuildOutput/TestResults/XamlCompiler/**
            BuildOutput/obj/**/XamlModules/**
            BuildOutput/obj/**/*.g.ixx
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: xamlc-formal-t4-companions
          path: src/XamlCompiler/BuildTasks/Microsoft/Xaml/XamlCompiler/CodeGenerators/**/*.cs
          retention-days: 7
