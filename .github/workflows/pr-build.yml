# PR build (OSS). Product-only compile gate; tests and signing run in internal ADO.

name: PR Build

on:
  pull_request:
    branches:
      - main
      - winui3/main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/policies/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'PRIVACY.md'
      - 'privacy.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTING_feedback_and_requests.md'
  workflow_dispatch: {}

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DISABLE_PR_BUILD_MATRIX_VALIDATION: 'false'

jobs:
  sync-xamlc-t4:
    name: Sync XamlC T4 outputs
    runs-on: windows-2025
    permissions:
      actions: write
      contents: write
    outputs:
      checkout_sha: ${{ steps.sync.outputs.checkout_sha }}
      generated_commit: ${{ steps.sync.outputs.generated_commit }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Locate MSBuild for T4 generation
        uses: microsoft/setup-msbuild@v2

      - name: Regenerate checked-in T4 classes
        id: sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild src\XamlCompiler\Microsoft.UI.Xaml.Markup.Compiler.csproj /t:TransformAll /p:TransformOnBuild=true /p:TransformOutOfDateOnly=false /p:BuildingInsideVisualStudio=true /m:1 /v:minimal
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          git diff --check
          $trackedChanges = @(git diff --name-only)
          $untrackedChanges = @(git ls-files --others --exclude-standard)
          $changed = @($trackedChanges + $untrackedChanges | Sort-Object -Unique)
          $unexpected = @()
          foreach ($file in $changed) {
              if ($file -notmatch '^src/XamlCompiler/BuildTasks/Microsoft/Xaml/XamlCompiler/CodeGenerators/.+\.cs

          if ($changed.Count -eq 0) {
              "checkout_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
              "generated_commit=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          $isSameRepoPr = "${{ github.event_name }}" -eq "pull_request" -and
              "${{ github.event.pull_request.head.repo.full_name }}" -eq "${{ github.repository }}"
          $isBot = "${{ github.actor }}" -eq "github-actions[bot]"

          if (-not $isSameRepoPr) {
              throw "XamlC T4 outputs are stale. Regenerate them with TransformAll and push the generated .cs files."
          }
          if ($isBot) {
              throw "XamlC T4 generation is not idempotent: the generated-output commit still produces changes."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/XamlCompiler/BuildTasks/Microsoft/Xaml/XamlCompiler/CodeGenerators
          git diff --cached --check
          git commit -m 'Regenerate XamlC T4 templates'
          $generatedSha = git rev-parse HEAD
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          "checkout_sha=$generatedSha" >> $env:GITHUB_OUTPUT
          "generated_commit=true" >> $env:GITHUB_OUTPUT

          # A push made with GITHUB_TOKEN does not recursively trigger the PR workflow.
          # Dispatch a fresh run explicitly so the validation check suite is attached
          # to the generated commit rather than to the stale pre-generation PR head.
          $env:GH_TOKEN = "${{ github.token }}"
          gh workflow run pr-build.yml --repo "${{ github.repository }}" --ref "${{ github.event.pull_request.head.ref }}"

  build:
    needs: sync-xamlc-t4
    if: needs.sync-xamlc-t4.outputs.generated_commit != 'true'
    name: Build (${{ matrix.flavor }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: x86chk
            platform: x86
            configuration: Debug
          - flavor: x86fre
            platform: x86
            configuration: Release
          - flavor: x64chk
            platform: x64
            configuration: Debug
          - flavor: x64fre
            platform: x64
            configuration: Release
          - flavor: arm64chk
            platform: arm64
            configuration: Debug
          - flavor: arm64fre
            platform: arm64
            configuration: Release
    env:
      WINUI_INIT_FLAVOR: ${{ matrix.flavor }}
      WINUI_BUILD_PLATFORM: ${{ matrix.platform }}
      WINUI_BUILD_CONFIGURATION: ${{ matrix.configuration }}
      BuildPlatform: ${{ matrix.platform }}
      NUGET_PACKAGES: ${{ github.workspace }}\packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Cap CL.exe parallelism: hosted runner has 2 vCPUs; default /m:4 OOMs (C1076).
      CL: '/MP2'

    steps:
      - name: Skip disabled PR Build validation
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION == 'true'
        shell: pwsh
        run: Write-Host "PR Build matrix validation is disabled by DISABLE_PR_BUILD_MATRIX_VALIDATION."

      - name: Checkout
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.sync-xamlc-t4.outputs.checkout_sha }}
          fetch-depth: 1
          show-progress: false

      - name: Initialize build environment and build
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        shell: pwsh
        run: |
          & "${{ github.workspace }}/.github/scripts/build-pr.ps1" `
            -Flavor $env:WINUI_INIT_FLAVOR `
            -Platform $env:WINUI_BUILD_PLATFORM `
            -Configuration $env:WINUI_BUILD_CONFIGURATION

      - name: Upload MSBuild binlogs
        if: failure() && env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: binlogs-${{ matrix.flavor }}
          path: BuildOutput/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload product runtime payload
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: winui-product-${{ matrix.flavor }}
          path: |
            BuildOutput/packaging/${{ matrix.configuration }}/runtimes-framework/win-${{ matrix.platform }}/**
          if-no-files-found: warn
          retention-days: 7
) {
                  $unexpected += $file
                  continue
              }

              $template = [System.IO.Path]::ChangeExtension($file, '.tt')
              if (-not (Test-Path $template)) {
                  $unexpected += $file
              }
          }
          if ($unexpected.Count -ne 0) {
              throw "TransformAll changed non-generated files: $($unexpected -join ', ')"
          }

          if ($changed.Count -eq 0) {
              "checkout_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
              exit 0
          }

          $isSameRepoPr = "${{ github.event_name }}" -eq "pull_request" -and
              "${{ github.event.pull_request.head.repo.full_name }}" -eq "${{ github.repository }}"
          $isBot = "${{ github.actor }}" -eq "github-actions[bot]"

          if (-not $isSameRepoPr) {
              throw "XamlC T4 outputs are stale. Regenerate them with TransformAll and push the generated .cs files."
          }
          if ($isBot) {
              throw "XamlC T4 generation is not idempotent: the generated-output commit still produces changes."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/XamlCompiler/BuildTasks/Microsoft/Xaml/XamlCompiler/CodeGenerators
          git diff --cached --check
          git commit -m 'Regenerate XamlC T4 templates'
          $generatedSha = git rev-parse HEAD
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          "checkout_sha=$generatedSha" >> $env:GITHUB_OUTPUT

  build:
    needs: sync-xamlc-t4
    name: Build (${{ matrix.flavor }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: x86chk
            platform: x86
            configuration: Debug
          - flavor: x86fre
            platform: x86
            configuration: Release
          - flavor: x64chk
            platform: x64
            configuration: Debug
          - flavor: x64fre
            platform: x64
            configuration: Release
          - flavor: arm64chk
            platform: arm64
            configuration: Debug
          - flavor: arm64fre
            platform: arm64
            configuration: Release
    env:
      WINUI_INIT_FLAVOR: ${{ matrix.flavor }}
      WINUI_BUILD_PLATFORM: ${{ matrix.platform }}
      WINUI_BUILD_CONFIGURATION: ${{ matrix.configuration }}
      BuildPlatform: ${{ matrix.platform }}
      NUGET_PACKAGES: ${{ github.workspace }}\packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Cap CL.exe parallelism: hosted runner has 2 vCPUs; default /m:4 OOMs (C1076).
      CL: '/MP2'

    steps:
      - name: Skip disabled PR Build validation
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION == 'true'
        shell: pwsh
        run: Write-Host "PR Build matrix validation is disabled by DISABLE_PR_BUILD_MATRIX_VALIDATION."

      - name: Checkout
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.sync-xamlc-t4.outputs.checkout_sha }}
          fetch-depth: 1
          show-progress: false

      - name: Initialize build environment and build
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        shell: pwsh
        run: |
          & "${{ github.workspace }}/.github/scripts/build-pr.ps1" `
            -Flavor $env:WINUI_INIT_FLAVOR `
            -Platform $env:WINUI_BUILD_PLATFORM `
            -Configuration $env:WINUI_BUILD_CONFIGURATION

      - name: Upload MSBuild binlogs
        if: failure() && env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: binlogs-${{ matrix.flavor }}
          path: BuildOutput/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload product runtime payload
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: winui-product-${{ matrix.flavor }}
          path: |
            BuildOutput/packaging/${{ matrix.configuration }}/runtimes-framework/win-${{ matrix.platform }}/**
          if-no-files-found: warn
          retention-days: 7
